services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: delphianlogic
      DB_USER: app
      DB_PASS: app_secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: delphianlogic
      MYSQL_USER: app
      MYSQL_PASSWORD: app_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
      # Auto-runs schema.sql then seed.sql on first boot (alphabetical order).
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
